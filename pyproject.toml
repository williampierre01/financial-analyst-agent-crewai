[project]
name = "financial-analyst-agent-crewai"
version = "0.1.0"
description = "Análise de ações brasileiras com Yahoo Finance e agentes de IA"
requires-python = ">=3.13,<3.14"
dependencies = [
    "crewai>=1.15.0",
    "crewai-tools[mcp]>=0.50.0",
    "ddgs>=9.0.0",
    "fastapi==0.143.0",
    "gradio>=4.40.0",
    "mcp>=1.9.0,<2",
    "openai>=1.30.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "tenacity>=8.3.0",
    "uvicorn==0.54.0",
    "yfinance>=0.2.60",
]

[dependency-groups]
# unittest vem com Python; httpx2 suporta o TestClient do Starlette instalado.
dev = [
    "httpx2==2.13.1",
]

[tool.uv]
package = false
required-version = "==0.11.33"
