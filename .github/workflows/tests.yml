name: Reproducible environment and tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install pinned environment manager
        run: python -m pip install -r requirements-tooling.txt
      - name: Recreate locked application environment
        run: uv sync --locked
      - name: Check dependency compatibility
        run: uv pip check
      - name: Check generated requirements
        run: |
          uv export --locked --no-dev --no-emit-project --no-header --output-file requirements.txt
          git diff --exit-code -- requirements.txt
      - name: Run offline application tests
        run: uv run --locked python -m unittest discover -s tests -v
