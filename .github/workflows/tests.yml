name: Reproducible environment and tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: auth_test
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: auth_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U auth_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      AUTH_TEST_DATABASE_URL: postgresql://auth_test:ci-disposable-only@localhost:5432/auth_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements-tooling.txt
      - run: uv sync --locked
      - name: Test PostgreSQL migrations and session lifecycle
        run: uv run --locked python -m unittest discover -s tests -p test_auth_database.py -v

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install pinned environment manager
        run: python -m pip install -r requirements-tooling.txt
      - name: Recreate locked application environment
        run: uv sync --locked
      - name: Check dependency compatibility
        run: uv pip check
      - name: Check generated requirements
        run: |
          uv export --locked --no-dev --no-emit-project --no-header --output-file requirements.txt
          git diff --exit-code -- requirements.txt
      - name: Run offline application tests
        run: uv run --locked python -m unittest discover -s tests -v
      - name: Check frontend API contract
        run: uv run --locked python -m backend.api.export_schema --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check generated TypeScript contract
        run: |
          npm run types:generate
          git diff --exit-code -- src/types/api.generated.ts
      - name: Check formatting and build
        run: |
          npm run format:check
          npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Test desktop, mobile and accessibility
        run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Prepare real API for integration tests
        working-directory: .
        run: |
          python -m pip install -r requirements-tooling.txt
          uv sync --locked
      - name: Test compiled frontend with real HTTP API
        run: npm run test:integration
      - name: Check Render shell scripts
        working-directory: .
        run: bash -n scripts/render-build.sh scripts/render-start.sh
